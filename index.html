<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche Teverun Blade Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=121">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="sunset-banner" role="alert" data-t="sunsetBannerHtml"></div>
  <p class="hint infobox" data-t="fwNoteHtml"></p>
  <p class="hint infobox" data-t="androidAppHtml"></p>

  <!-- (a) intro -->
  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <!-- (b) connection -->
  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-act="connect"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="connHint"></p>
  </div>

  <!-- (c) live telemetry -->
  <div class="card" id="live-card" hidden>
    <h2 data-t="liveTitle"></h2>
    <div class="verdict neutral" id="fw-state"><b></b></div>
    <div class="grid">
      <div class="tile"><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile"><b id="t-lock">-</b><small data-t="tileLock"></small></div>
      <div class="tile"><b id="t-gear">-</b><small data-t="tileGear"></small></div>
      <div class="tile" id="tile-cur"><b id="t-cur">-</b><small data-t="tileCur"></small></div>
      <div class="tile"><b id="t-cruise">-</b><small data-t="tileCruise"></small></div>
      <div class="tile"><b id="t-wheel">-</b><small data-t="tileWheel"></small></div>
      <div class="tile"><b id="t-unit">-</b><small data-t="tileUnit"></small></div>
      <div class="tile"><b id="t-abs">-</b><small data-t="tileAbs"></small></div>
      <div class="tile"><b id="t-fw">-</b><small data-t="tileFw"></small></div>
      <div class="tile"><b id="t-serial">-</b><small data-t="tileSerial"></small></div>
      <div class="tile"><b id="t-slimit">-</b><small data-t="tileSlimit"></small></div>
      <div class="tile"><b id="t-ptemp">-</b><small data-t="tilePtemp"></small></div>
      <div class="tile"><b id="t-poles">-</b><small data-t="tilePoles"></small></div>
      <div class="tile"><b id="t-startmode">-</b><small data-t="tileStartMode"></small></div>
      <div class="tile"><b id="t-eco">-</b><small data-t="tileEco"></small></div>
      <div class="tile"><b id="t-antitheft">-</b><small data-t="tileAntitheft"></small></div>
      <div class="tile"><b id="t-smart">-</b><small data-t="tileSmart"></small></div>
      <div class="tile"><b id="t-reverse">-</b><small data-t="tileReverse"></small></div>
      <div class="tile"><b id="t-sleep">-</b><small data-t="tileSleep"></small></div>
      <div class="tile"><b id="t-ptime">-</b><small data-t="tilePtime"></small></div>
      <div class="tile"><b id="t-avg">-</b><small data-t="tileAvg"></small></div>
      <div class="tile"><b id="t-max">-</b><small data-t="tileMax"></small></div>
      <div class="tile"><b id="t-trip">-</b><small data-t="tileTrip"></small></div>
      <div class="tile"><b id="t-odo">-</b><small data-t="tileOdo"></small></div>
      <div class="tile"><b id="t-battlock">-</b><small data-t="tileBattLock"></small></div>
      <div class="tile"><b id="t-gpslock">-</b><small data-t="tileGpsLock"></small></div>
    </div>
    <p class="hint" data-t="liveHint"></p>
    <div class="btns">
      <button class="primary span2" id="btn-err" data-t="btnErr" disabled></button>
    </div>
  </div>

  <!-- (d) battery telemetry -->
  <div class="card" id="batt-card" hidden>
    <h2 data-t="battTitle"></h2>
    <div class="grid">
      <div class="tile"><b id="t-batt">-</b><small data-t="tileBatt"></small></div>
      <div class="tile"><b id="t-volt">-</b><small data-t="tileVolt"></small></div>
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-bat" data-t="btnBat" disabled></button>
    </div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <!-- (e) settings -->
  <div class="card" id="more-card" hidden>
    <h2 data-t="setTitle"></h2>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <div class="btns">
      <button class="primary span2" id="btn-toggle" disabled></button>
    </div>
    <p class="hint" id="lock-reason" hidden></p>
    <div class="speed-cols">
      <div class="set-row"><label data-t="lblOpen"></label><input id="speed-open" type="number" min="1" max="100" placeholder="45"></div>
      <div class="set-row"><label data-t="lblLegal"></label><input id="speed-legal" type="number" min="1" max="22" placeholder="21"></div>
    </div>
    <p class="hint" data-t="controlsHint"></p>
    <p class="hint" data-t="speedValuesHint"></p>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div class="set-row">
      <label data-t="lblWheel"></label>
      <input id="wheel-in" type="number" min="1" max="25.5" step="0.1" disabled>
      <button id="btn-set-wheel" data-t="btnSetWheel" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblCruise"></label>
      <select id="cruise-in" disabled>
        <option value="0" data-t="cruiseOff"></option>
        <option value="1" data-t="cruiseAuto"></option>
        <option value="2" data-t="cruiseManual"></option>
      </select>
      <button id="btn-set-cruise" data-t="btnSetCruise" disabled></button>
    </div>
    <p class="hint" data-t="setBasicHint"></p>
  </div>

  <!-- (f) advanced settings - per-gear expert grid -->
  <div class="card" id="raw-card" hidden>
    <h2 data-t="advTitle"></h2>
    <p class="hint" data-t="advHint"></p>
    <div class="gears">
      <div class="gear-row gear-head"><span></span><span data-t="gearColSpeed"></span><span data-t="gearColLock"></span><span data-t="gearColFront"></span><span data-t="gearColRear"></span><span data-t="gearColCur"></span><span data-t="gearColEabs"></span></div>
      <div class="gear-row">
        <label id="gear-lbl-1"></label>
        <input id="g1-in" type="number" min="1" max="100" value="45">
        <input id="g1-lock" type="number" min="1" max="22" value="10">
        <input id="g1-fs" type="number" min="0" max="15" placeholder="5">
        <input id="g1-rs" type="number" min="0" max="15" placeholder="5">
        <input id="g1-cur" type="number" min="0" max="255" value="20">
        <input id="g1-eabs" type="number" min="0" max="15" placeholder="2">
      </div>
      <div class="gear-row">
        <label id="gear-lbl-2"></label>
        <input id="g2-in" type="number" min="1" max="100" value="60">
        <input id="g2-lock" type="number" min="1" max="22" value="15">
        <input id="g2-fs" type="number" min="0" max="15" placeholder="5">
        <input id="g2-rs" type="number" min="0" max="15" placeholder="5">
        <input id="g2-cur" type="number" min="0" max="255" value="25">
        <input id="g2-eabs" type="number" min="0" max="15" placeholder="2">
      </div>
      <div class="gear-row">
        <label id="gear-lbl-3"></label>
        <input id="g3-in" type="number" min="1" max="100" value="80">
        <input id="g3-lock" type="number" min="1" max="22" value="21">
        <input id="g3-fs" type="number" min="0" max="15" placeholder="5">
        <input id="g3-rs" type="number" min="0" max="15" placeholder="5">
        <input id="g3-cur" type="number" min="0" max="255" value="30">
        <input id="g3-eabs" type="number" min="0" max="15" placeholder="2">
      </div>
    </div>
  </div>

  <!-- (g) log -->
  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <label class="log-opt"><span data-t="publicLogLabel"></span><input type="checkbox" id="public-log" checked></label>
      <label class="log-opt"><span data-t="diagLogLabel"></span><input type="checkbox" id="diag-log"></label>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <!-- (h) footer -->
  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/trbm-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="err" aria-labelledby="err-title">
  <div class="doc-head">
    <h3 id="err-title" data-t="errTitle"></h3>
    <button type="button" id="err-close">&times;</button>
  </div>
  <div class="dlg-body">
    <p class="hint" data-t="errHint"></p>
    <div id="err-list"></div>
  </div>
  <div class="dlg-foot">
    <button class="primary" id="err-close-2" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="bat" aria-labelledby="bat-title">
  <div class="doc-head">
    <h3 id="bat-title" data-t="batTitle"></h3>
    <button type="button" id="bat-close">&times;</button>
  </div>
  <div class="dlg-body">
    <p class="hint" data-t="batHint"></p>
    <h4 class="dlg-sec" data-t="batHealthTitle"></h4>
    <div id="bat-health"></div>
    <hr class="sep">
    <h4 class="dlg-sec" data-t="batPackTitle"></h4>
    <div id="bat-pack"></div>
    <hr class="sep">
    <h4 class="dlg-sec" data-t="batCellsTitle"></h4>
    <div class="grid cells" id="bat-cells"></div>
  </div>
  <div class="dlg-foot">
    <button class="primary" id="bat-close-2" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="fwwarn" aria-labelledby="fwwarn-title">
  <div class="doc-head">
    <h3 id="fwwarn-title" data-t="fwWarnTitle"></h3>
    <button type="button" id="fwwarn-close">&times;</button>
  </div>
  <div class="dlg-body">
    <p class="warn" id="fwwarn-msg"></p>
  </div>
  <div class="dlg-foot">
    <button class="primary" id="fwwarn-close-2" data-t="docClose"></button>
  </div>
</dialog>

<script src="report-footer.js?v=121"></script>
<script src="i18n.js?v=121"></script>
<script src="app.js?v=121"></script>
</body>
</html>
